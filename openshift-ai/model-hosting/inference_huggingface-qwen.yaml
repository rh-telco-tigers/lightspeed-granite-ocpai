apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3.5-9b
  namespace: llm-serving
  annotations:
    modelFormat: vLLM
    serving.kserve.io/stop: 'false'
    security.opendatahub.io/enable-auth: 'false' # change this to true and create openshift tokens to enable access controls
    openshift.io/display-name: qwen3.5-9b
    serving.kserve.io/deploymentMode: Standard
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
    opendatahub.io/hardware-profile-name: nvidia-gpu
    opendatahub.io/model-type: generative
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: RollingUpdate
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - '--max-model-len=15000'
        - '--max-num-seqs=4'
        - '--gpu-memory-utilization=0.95'
        - '--enforce-eager'
        - '--enable-auto-tool-choice'
        - '--tool-call-parser=qwen3_xml'
      modelFormat:
        name: vLLM   # or match your ServingRuntime
      runtime: vllm-cuda-runtime  # name of your ServingRuntime
      storageUri: hf://qwen/qwen3.5-9b
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 48Gi
          nvidia.com/gpu: "1"
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
    