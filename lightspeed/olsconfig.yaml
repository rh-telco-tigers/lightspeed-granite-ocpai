apiVersion: v1
items:
- apiVersion: ols.openshift.io/v1alpha1
  kind: OLSConfig
  metadata:
    name: cluster
  spec:
    llm:
      providers:
      - credentialsSecretRef:
          name: gemma-creds
        models:
        - contextWindowSize: 35000
          name: granite41-3b
          parameters:
            toolBudgetRatio: 0.5
        name: red_hat_openshift_ai
        type: rhoai_vllm
        url: http://granite41-3b-predictor.llm-serving.svc.cluster.local:8080/v1
    ols:
      conversationCache:
        postgres:
          maxConnections: 2000
          sharedBuffers: 256MB
        type: postgres
      defaultModel: granite41-3b
      defaultProvider: red_hat_openshift_ai
      deployment:
        api:
          replicas: 1
        console:
          replicas: 1
        dataCollector: {}
        database:
          replicas: 1
        mcpServer: {}
      introspectionEnabled: true
      logLevel: DEBUG
      maxIterations: 5
      userDataCollection: {}
    olsDataCollector:
      logLevel: INFO
